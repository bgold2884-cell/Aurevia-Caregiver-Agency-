function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

var inactivityTimer=null,inactivityEvents=["pointerdown","pointermove","keydown","scroll","touchstart","click"];
function clearInactivity(){if(inactivityTimer)clearTimeout(inactivityTimer);inactivityTimer=null}
function startInactivityLock(){clearInactivity();inactivityEvents.forEach(function(ev){document.addEventListener(ev,resetInactivity,{passive:true})});resetInactivity()}
function stopInactivityLock(){clearInactivity();inactivityEvents.forEach(function(ev){document.removeEventListener(ev,resetInactivity)})}
function resetInactivity(){clearInactivity();if(sb&&role)inactivityTimer=setTimeout(async function(){stopInactivityLock();await sb.auth.signOut();alert("For your security, AUREVIA Admin was signed out after 10 minutes of inactivity. Please sign in again.");location.reload()},10*60*1000)}

async function init(){var q=await sb.auth.getSession(),s=q.data.session;if(!s)return login();

$("#loginForm").onsubmit=async function(e){e.preventDefault();var em=$("#em").value.trim().toLowerCase(),pw=$("#pw").value;$("#go").disabled=true;$("#lm").textContent="Signing in…";var r=await sb.auth.signInWithPassword({email:em,password:pw});$("#go").disabled=false;if(r.error){$("#lm").textContent="Sign-in failed: "+r.error.message;return}await init()};

async function go(t){var backBtn=$("#dashboardHome");if(backBtn)backBtn.hidden=(t==="home");if(t==="home"){document.querySelectorAll("#tabs button").forEach(function(b){b.className=b.dataset.t==="home"?"on":""});var m=$("#main");m.onclick=m.oninput=m.onchange=null;var icons={req:"📥",ord:"🧾",prod:"🛍️",blog:"✍️",rates:"💳",cng:"🇳🇬",cin:"🌍",area:"📍",del:"🚚",texts:"📝",images:"🖼️",contact:"☎️",pol:"📋",bro:"📄",analytics:"📊",staff:"👥"};var desc={req:"Review and manage incoming enquiries and applications.",ord:"Open and update customer orders.",prod:"Manage products displayed on the website.",blog:"Create and manage website articles.",rates:"Edit service rates and pricing information.",cng:"Manage Care Circle Nigeria plans.",cin:"Manage Care Circle International plans.",area:"Manage service coverage areas.",del:"Manage delivery areas, fees and times.",texts:"Edit the words displayed on the website.",images:"Manage website images.",contact:"Update public contact information.",pol:"Manage website policies.",bro:"Manage brochure content.",analytics:"Review available website and admin activity.",staff:"Manage staff access and roles."};var visible=TABS.filter(function(x){return ["staff","texts","images","contact","analytics"].indexOf(x[0])<0||role==="owner"});m.innerHTML='<section class="dash-intro"><h2 style="margin-bottom:4px">Workspace dashboard</h2><p class="n" style="margin-top:0">Choose a section to open it. Your existing search and section tools are unchanged.</p></section><div class="dash-grid">'+visible.map(function(x){return '<button class="dash-tile" data-open="'+x[0]+'"><span class="dash-icon" aria-hidden="true">'+icons[x[0]]+'</span><strong>'+x[1]+'</strong><small>'+desc[x[0]]+'</small></button>'}).join("")+'</div>';m.onclick=function(e){var b=e.target.closest("[data-open]");if(b)go(b.dataset.open)};return}if(role!=="owner"&&["staff","texts","images","contact","analytics"].indexOf(t)>=0)return msg("This section is available to the owner only.");if(role!=="owner"){var pr=await sb.rpc("my_supervisor_permissions"),allowed=pr.data||["req","ord"];if(pr.error)return msg("Could not verify your permissions. Please refresh or contact the owner.");if(allowed.indexOf(t)<0)return msg("Your supervisor account does not have permission for this section.");}if(role==="owner"||t==="req"||t==="ord")sb.from("website_events").insert({event_type:"admin_section_view",page_path:"/admin.html#"+t,visitor_id:"staff-"+(await sb.auth.getUser()).data.user.id,metadata:{section:t,role:role}});document.querySelectorAll("#tabs button").forEach(function(b){b.className=b.dataset.t==t?"on":""});var m=$("#main");m.onclick=m.oninput=m.onchange=null;TABS.filter(function(x){return x[0]==t})[0][2]()}
async function counts(){var a=await sb.from("submissions").select("id",{count:"exact",head:true}).eq("status","new"),b=await sb.from("orders").select("id",{count:"exact",head:true}).eq("status","new"),n=(a.count||0)+(b.count||0);
[["req",a.count],["ord",b.count]].forEach(function(x){var e=$("#b-"+x[0]);if(e){e.textContent=x[1]||0;e.hidden=!x[1]}});document.title=(n?"("+n+") ":"")+"AUREVIA Admin";
if(lastNew!==null&&n>lastNew&&window.Notification&&Notification.permission=="granted")new Notification("AUREVIA: "+(n-lastNew)+" new request(s) or order(s)");lastNew=n}
var TY={career:"Application",assessment:"Assessment",escort:"Escort booking",enquiry:"Enquiry"},
ST={career:["new","reviewing","interview","references","verified","hired","declined"],_:["new","in progress","done"]},OS=["new","confirmed","packed","out for delivery","delivered","cancelled"],PS=["unpaid","payment received","refunded"];
function opts(a,v){return a.map(function(s){return'<option'+(s==v?" selected":"")+'>'+s+'</option>'}).join("")}
function wal(p){return(p||"").replace(/\D/g,"").replace(/^0/,"234")}
function contacts(x){var d=wal(x.phone);return(d?'<a class="btn" target="_blank" rel="noopener" href="https://wa.me/'+d+'">WhatsApp</a><a class="btn" href="tel:+'+d+'">Call</a>':'')+(x.email?'<a class="btn" href="mailto:'+esc(x.email)+'">Email</a>':'')}
async function reqs(){var r=await sb.from("submissions").select("*").order("created_at",{ascending:false}).limit(500),all=r.data||[],m=$("#main");
m.innerHTML='<div class="card"><input id="q" placeholder="Search name, phone, email or text"><div class="r2"><select id="ft"><option value="">All types</option>'+Object.keys(TY).map(function(k){return'<option value="'+k+'">'+TY[k]+'</option>'}).join("")+'</select><select id="fs"><option value="">All statuses</option>'+opts(ST.career.concat(["in progress","done"]).filter(function(v,i,a){return a.indexOf(v)==i}))+'</select></div></div><div id="lst"></div>';
function card(x){var o=ST[x.type]||ST._;return'<details class="card"><summary><b>'+esc(TY[x.type]||x.type)+'</b> · '+esc(x.name)+' · '+new Date(x.created_at).toLocaleDateString()+' <i class="tag '+(x.status=="new"?"":"done")+'">'+esc(x.status)+'</i></summary><pre>'+esc(x.message)+'</pre>'+(x.files&&x.files.length?'<p><b>Uploaded documents</b></p>'+x.files.map(function(f){return'<button data-f="'+esc(f.path)+'">'+(f.kind=="cvf"?"CV":f.kind=="idf"?"ID":"Credential")+': '+esc(f.name)+'</button>'}).join(""):"")+'<label>Status<select class="st" data-id="'+x.id+'">'+opts(o,x.status)+'</select></label><label>Private notes<textarea id="n'+x.id+'" rows="3">'+esc(x.notes)+'</textarea></label><button data-sv="'+x.id+'">Save note</button><p>'+contacts(x)+(role=="owner"?'<button data-del="'+x.id+'">Delete</button>':'')+'</p></details>'}

m.onclick=async function(e){var b=e.target.dataset;if(b.f){var u=await sb.storage.from("applications").createSignedUrl(b.f,300);if(u.error)return msg(u.error.message);window.open(u.data.signedUrl,"_blank")}else if(b.sv){var item=all.find(function(z){return String(z.id)===String(b.sv)}),patch={notes:$("#n"+b.sv).value};if(item&&item.status==="new")patch.status="reviewing";var n=await sb.from("submissions").update(patch).eq("id",b.sv);if(!n.error&&item)Object.assign(item,patch);msg(n.error?n.error.message:(patch.status?"Note saved; request moved to reviewing.":"Note saved"));draw();counts()}else if(b.del&&confirm("Delete this for good?")){await sb.from("submissions").delete().eq("id",b.del);reqs()}};

async function ords(){
var r=await sb.from("orders").select("*").order("created_at",{ascending:false}).limit(500),all=r.data||[],m=$("#main");
if(r.error){m.innerHTML='<div class="card"><h3>Orders could not load</h3><p>'+esc(r.error.message)+'</p><button onclick="ords()">Try again</button></div>';return}
var OS=["new","awaiting delivery quotation","awaiting customer confirmation","awaiting payment","paid","processing","dispatched","delivered","cancelled"],PS=["unpaid","payment received","refunded"];
m.innerHTML='<div class="card"><p class="n">Set the delivery fee before confirming an order. Verify that payment has actually arrived in the bank before marking an order paid.</p><input id="q" placeholder="Search customer, phone or order reference"><div class="r2"><select id="fs"><option value="">All order statuses</option>'+opts(OS)+'</select><select id="fp"><option value="">All payment statuses</option>'+opts(PS)+'</select></div></div><div id="lst"></div>';
function card(x){

var phone=x.whatsapp||x.phone||"",digits=String(phone).replace(/\D/g,"");if(digits.charAt(0)==="0")digits="234"+digits.slice(1);

return '<details class="card"><summary><b>'+esc(x.ref||x.id)+'</b> · '+esc(x.name)+' · ₦'+total.toLocaleString()+' <i class="tag">'+esc(x.status||"new")+'</i> <i class="tag">'+esc(x.payment_status||"unpaid")+'</i></summary><p>'+items+'</p><p><b>Customer:</b> '+esc(x.name)+'<br><b>Phone:</b> '+esc(x.phone)+'<br><b>WhatsApp:</b> '+esc(x.whatsapp||x.phone)+'<br><b>Email:</b> '+esc(x.email)+'<br><b>Address:</b> '+esc(x.address)+' '+esc(x.customer_city||x.area||"")+' '+esc(x.customer_state||"")+'<br><b>Instructions:</b> '+esc(x.instructions)+'</p><p>Items subtotal: <b>₦'+sub.toLocaleString()+'</b></p><div class="r2"><label>Delivery fee (₦)<input type="number" min="0" step="1" data-fee="'+x.id+'" value="'+(fee===""?"":fee)+'" placeholder="Enter delivery fee"></label><label>Final total (₦)<input readonly value="'+(fee===""?"Enter delivery fee":total.toLocaleString())+'"></label></div><label>Order status<select class="os" data-id="'+x.id+'">'+opts(OS,x.status||"new")+'</select></label><label>Payment status<select class="op" data-id="'+x.id+'">'+opts(PS,x.payment_status||"unpaid")+'</select></label><label>Payment method / transfer reference<input id="pn'+x.id+'" value="'+esc(x.payment_note||x.transfer_reference||"")+'" placeholder="Only record after verifying payment"></label><label>Private notes<textarea id="on'+x.id+'" rows="2">'+esc(x.notes||"")+'</textarea></label><button data-feesave="'+x.id+'">Save delivery fee & total</button><button data-confirm="'+x.id+'">Confirm final total</button><button data-payreq="'+x.id+'">Prepare WhatsApp confirmation</button><button data-so="'+x.id+'">Save notes</button><p>'+(digits?'<a class="btn" target="_blank" rel="noopener" href="https://wa.me/'+digits+'?text='+encodeURIComponent(msgText)+'">Open WhatsApp</a>':'')+(x.email?'<a class="btn" href="mailto:'+esc(x.email)+'?subject='+encodeURIComponent("AUREVIA order "+(x.ref||x.id))+'&body='+encodeURIComponent(msgText)+'">Email customer</a>':'')+' '+contacts(x)+(role==="owner"?'<button data-do="'+x.id+'">Delete</button>':'')+'</p><p class="n">Mark payment received only after verifying the amount in your bank. Keep the transfer reference in the note.</p></details>'}

draw();

if(b.so){var n=await sb.from("orders").update({notes:$("#on"+b.so).value,payment_note:$("#pn"+b.so).value}).eq("id",b.so);msg(n.error?n.error.message:"Saved")}

async function analyticsEd(){
var m=$("#main"),days=30,events=[],period="30";
m.innerHTML='<div class="card"><h2>Website Analytics</h2><p class="n">Anonymous website activity and business totals. Visitor tracking starts only after the public-site tracking script is installed.</p><label>Reporting period<select id="an-period"><option value="1">Today</option><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option></select></label><button class="btn" id="an-refresh">Refresh analytics</button></div><div id="an-stats" class="r2"></div><div class="card"><h3>Most viewed pages</h3><div id="an-pages">Loading…</div></div><div class="card"><h3>Recent website activity</h3><div id="an-events">Loading…</div></div>';
async function load(){
period=$("#an-period").value;days=Number(period);
var since=new Date(Date.now()-days*86400000).toISOString();
var e=await sb.from("website_events").select("event_type,page_path,visitor_id,created_at").gte("created_at",since).order("created_at",{ascending:false}).limit(5000);
if(e.error){$("#an-stats").innerHTML='<p>Analytics could not load: '+esc(e.error.message)+'</p>';return}
events=e.data||[];
var uniq=new Set(events.filter(x=>x.event_type==="page_view").map(x=>x.visitor_id)).size;
var views=events.filter(x=>x.event_type==="page_view").length;
var clicks=events.filter(x=>x.event_type==="click").length;
var now=new Date(Date.now()-30*60000).toISOString(),active=new Set(events.filter(x=>x.event_type==="page_view"&&x.created_at>=now).map(x=>x.visitor_id)).size;
var start=since;
var q=await sb.from("orders").select("id,status,payment_status,created_at").gte("created_at",start).limit(5000);
var s=await sb.from("submissions").select("id,type,created_at").gte("created_at",start).limit(5000);
var orders=q.data||[],subs=s.data||[];
var cards=[["Unique visitors",uniq],["Page views",views],["Active (last 30 min)",active],["Button clicks",clicks],["Admin sign-ins",events.filter(x=>x.event_type==="admin_login").length],["Admin section visits",events.filter(x=>x.event_type==="admin_section_view").length],["Orders received",orders.length],["Payments received",orders.filter(x=>x.payment_status==="payment received").length],["Enquiries & applications",subs.length]];
$("#an-stats").innerHTML=cards.map(x=>'<div class="card"><div class="n">'+x[0]+'</div><h2>'+x[1]+'</h2></div>').join("");
var pages={};events.filter(x=>x.event_type==="page_view").forEach(x=>pages[x.page_path]=(pages[x.page_path]||0)+1);
var sorted=Object.keys(pages).sort((a,b)=>pages[b]-pages[a]);
$("#an-pages").innerHTML=sorted.length?sorted.slice(0,15).map(x=>'<div class="row"><span>'+esc(x)+'</span><b>'+pages[x]+'</b></div>').join(""):"No page views recorded yet. Install the public tracking script to begin.";
$("#an-events").innerHTML=events.length?events.slice(0,40).map(x=>'<div class="row"><span>'+esc(x.event_type.replace(/_/g," "))+' · '+esc(x.page_path)+'</span><span class="n">'+new Date(x.created_at).toLocaleString()+'</span></div>').join(""):"No activity recorded yet.";
}
$("#an-refresh").onclick=load;$("#an-period").onchange=load;await load();
}
